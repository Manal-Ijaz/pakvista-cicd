name: ci-staging

on:
  pull_request:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Checkout
        uses: actions/checkout@v4

      - name: Step 2 - Lint and Build
        run: |
          npm install -g htmlhint stylelint parcel
          htmlhint "*.html"
          stylelint "*.css"
          parcel build index.html

      - name: Step 3 - Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Step 4 - Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:staging-latest,${{ secrets.DOCKERHUB_USERNAME }}/pakvista:staging-${{ github.sha }}

      - name: Step 5 and 6 - Push Tagged Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:staging-latest,${{ secrets.DOCKERHUB_USERNAME }}/pakvista:staging-${{ github.sha }}